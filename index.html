<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Emulator</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: system-ui, -apple-system, sans-serif;
      background: #111827;
      color: #e5e7eb;
    }

    body {
      margin: 0;
      min-height: 100vh;
      overflow: hidden;
    }

    main {
      width: 100vw;
      height: 100vh;
    }

    #screen_container {
      width: 100%;
      height: 100%;
      background: #000;
      overflow: auto;
    }

    #screen_container > div {
      white-space: pre;
      font: 14px monospace;
      line-height: 14px;
    }

    #screen_container canvas {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    #status {
      position: fixed;
      left: 1rem;
      bottom: 1rem;
      color: #9ca3af;
      font-size: 0.9rem;
    }
  </style>
</head>
<body>
  <main>
    <div id="screen_container" aria-label="Virtual machine display">
      <div></div>
      <canvas style="display: none"></canvas>
    </div>

    <span id="status">Starting emulator…</span>
  </main>

  <script src="emulator/libv86.js"></script>
  <script>
    "use strict";

    const status = document.getElementById("status");

    const emulator = new V86({
      wasm_path: "emulator/v86.wasm",
      memory_size: 128 * 1024 * 1024,
      vga_memory_size: 8 * 1024 * 1024,
      screen_container: document.getElementById("screen_container"),
      bios: { url: "emulator/seabios.bin" },
      vga_bios: { url: "emulator/vgabios.bin" },
      cdrom: { url: "alpine-32bit-x86.iso" },
      autostart: true
    });

    emulator.add_listener("emulator-ready", () => {
      status.textContent = "Ready";
    });

    emulator.add_listener("emulator-started", () => {
      status.textContent = "Running";
    });

    emulator.add_listener("emulator-stopped", () => {
      status.textContent = "Paused";
    });
function showOverlay() {
  const overlay = document.createElement('div');
  Object.assign(overlay.style, {
    position: 'fixed',
    top: '0',
    left: '0',
    width: '100vw',
    height: '100vh',
    backgroundColor: 'rgba(0, 0, 0, 0.7)',
    color: '#ffffff',
    display: 'flex',
    justifyContent: 'center',
    alignItems: 'center',
    zIndex: '9999',
    fontSize: '24px',
    fontFamily: 'sans-serif'
  });
  overlay.innerHTML = `<div><img src="/dog.gif" alt="Dog GIF" style="max-width: 100%; height: auto;"><p>Bro plz gimme money!</p><p>You should know how to use linux</p><p>User is "root" ofc</p></div>`;
  document.body.appendChild(overlay);
  setTimeout(() => {
    overlay.remove();
  }, 15000);
}
showOverlay();
  </script>
</body>
</html>
